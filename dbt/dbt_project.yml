name: horizon
version: '1.0.0'
config-version: 2
profile: horizon
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  horizon:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: fail
      +full_refresh: false
      +schema: core
    marts:
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: fail
      +full_refresh: false
      +schema: marts
