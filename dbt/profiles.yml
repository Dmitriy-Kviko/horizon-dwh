horizon:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DWH_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DWH_PORT', '5432') | int }}"
      user: "{{ env_var('DWH_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_DWH_PASSWORD', '') }}"
      dbname: "{{ env_var('DWH_DB', 'horizon') }}"
      schema: public
      threads: 4
